name: Lockwood dependency tree
description: "Render a pixel-art tree of your project's dependencies from its lockfile and commit the image for your README."
author: LuckyType
branding:
  icon: git-branch
  color: green
inputs:
  lockfile:
    description: "Path to the lockfile. Leave empty to pick the first of uv.lock, poetry.lock, Pipfile.lock, package-lock.json, bun.lock, yarn.lock, pnpm-lock.yaml, Cargo.lock, Gemfile.lock or composer.lock found in the repository root."
    default: ''
  output:
    description: "Where to write the image (.png or .svg)."
    default: .github/lockwood/tree.png
  badge:
    description: "Optional path for a shields-style SVG badge with the tree's age and package count. Empty disables it."
    default: ''
  style:
    description: "Tree style. One of oak, pine, willow, sakura, bonsai."
    default: oak
  width:
    description: "Pixel-grid width before scaling."
    default: '400'
  height:
    description: "Pixel-grid height before scaling."
    default: '300'
  scale:
    description: "Upscale factor for the written image."
    default: '2'
  background:
    description: "transparent, sky, or a #rrggbb colour."
    default: transparent
  seed:
    description: "Layout seed. 0 is the canonical tree; any other number grows a different one."
    default: '0'
  commit:
    description: "Commit and push the image when it changed. Needs `permissions: contents: write` on the job."
    default: 'true'
  commit-message:
    description: "Commit message used when the image changed."
    default: 'chore: update dependency tree'
outputs:
  summary:
    description: "One-line summary of the rendered tree."
    value: ${{ steps.render.outputs.summary }}
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: '20'
    - id: render
      shell: bash
      env:
        LW_LOCK: ${{ inputs.lockfile }}
        LW_OUT: ${{ inputs.output }}
        LW_BADGE: ${{ inputs.badge }}
        LW_STYLE: ${{ inputs.style }}
        LW_WIDTH: ${{ inputs.width }}
        LW_HEIGHT: ${{ inputs.height }}
        LW_SCALE: ${{ inputs.scale }}
        LW_BG: ${{ inputs.background }}
        LW_SEED: ${{ inputs.seed }}
      run: |
        set -euo pipefail
        args=(--out "$LW_OUT" --style "$LW_STYLE" --width "$LW_WIDTH" --height "$LW_HEIGHT" --scale "$LW_SCALE" --bg "$LW_BG" --seed "$LW_SEED")
        if [ -n "$LW_LOCK" ]; then args+=(--lock "$LW_LOCK"); fi
        if [ -n "$LW_BADGE" ]; then args+=(--badge "$LW_BADGE"); fi
        summary=$(node "${{ github.action_path }}/bin/lockwood.js" "${args[@]}")
        echo "$summary"
        echo "summary=$summary" >> "$GITHUB_OUTPUT"
        echo "### Lockwood" >> "$GITHUB_STEP_SUMMARY"
        echo "$summary" >> "$GITHUB_STEP_SUMMARY"
    - if: inputs.commit == 'true'
      shell: bash
      env:
        LW_OUT: ${{ inputs.output }}
        LW_BADGE: ${{ inputs.badge }}
        LW_MSG: ${{ inputs.commit-message }}
      run: |
        set -euo pipefail
        git add -- "$LW_OUT"
        if [ -n "$LW_BADGE" ]; then git add -- "$LW_BADGE"; fi
        if git diff --cached --quiet; then echo "Tree unchanged, nothing to commit."; exit 0; fi
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git commit -m "$LW_MSG"
        git push
