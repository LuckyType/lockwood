lockfileVersion: '9.0'

settings:
  autoInstallPeers: true
  excludeLinksFromLockfile: false

importers:

  .:
    dependencies:
      debug:
        specifier: ^4.3.4
        version: 4.3.4
      ms:
        specifier: ^2.1.3
        version: 2.1.3
    devDependencies:
      typescript:
        specifier: ^5.4.5
        version: 5.4.5

packages:

  debug@4.3.4:
    resolution: {integrity: sha512-abc}
    engines: {node: '>=6.0'}
    peerDependencies:
      supports-color: '*'
    peerDependenciesMeta:
      supports-color:
        optional: true

  ms@2.1.2:
    resolution: {integrity: sha512-def}

  ms@2.1.3:
    resolution: {integrity: sha512-ghi}

  typescript@5.4.5:
    resolution: {integrity: sha512-jkl}
    engines: {node: '>=14.17'}
    hasBin: true

snapshots:

  debug@4.3.4:
    dependencies:
      ms: 2.1.2

  ms@2.1.2: {}

  ms@2.1.3: {}

  typescript@5.4.5: {}
